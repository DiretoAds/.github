<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="440" y1="66" x2="862" y2="66"/>
    <line x1="440" y1="114" x2="862" y2="114"/>
    <line x1="440" y1="162" x2="862" y2="162"/>
    <line x1="440" y1="210" x2="862" y2="210"/>
  </g>

  <text x="48" y="104" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">DiretoAds</text>
  <text x="50" y="138" fill="#93c5fd" font-size="18" font-weight="600">Agência de tráfego pago · Direct response</text>
  <text x="50" y="182" fill="#cbd5e1" font-size="14" opacity="0.85">Do clique no anúncio à venda — e à escala.</text>
  <text x="440" y="236" fill="#64748b" font-size="12">cliques</text>
  <text x="808" y="236" fill="#22c55e" font-size="12" font-weight="700">vendas</text>

  <g>
    <rect x="455" width="40" rx="5" y="164" height="46" fill="url(#bar)" opacity="0.92">
      <animate attributeName="height" values="0;46;46;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;164;164;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" width="40" rx="5" y="136" height="74" fill="url(#bar)" opacity="0.92">
      <animate attributeName="height" values="0;74;74;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.12s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;136;136;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.12s" repeatCount="indefinite"/>
    </rect>
    <rect x="585" width="40" rx="5" y="150" height="60" fill="url(#bar)" opacity="0.92">
      <animate attributeName="height" values="0;60;60;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.24s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;150;150;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.24s" repeatCount="indefinite"/>
    </rect>
    <rect x="650" width="40" rx="5" y="102" height="108" fill="url(#bar)" opacity="0.92">
      <animate attributeName="height" values="0;108;108;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;102;102;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.36s" repeatCount="indefinite"/>
    </rect>
    <rect x="715" width="40" rx="5" y="72" height="138" fill="url(#bar)" opacity="0.92">
      <animate attributeName="height" values="0;138;138;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.48s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;72;72;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.48s" repeatCount="indefinite"/>
    </rect>
    <rect x="780" width="40" rx="5" y="42" height="168" fill="url(#bar)">
      <animate attributeName="height" values="0;168;168;0" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;42;42;210" keyTimes="0;0.35;0.9;1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <polyline points="475,168 540,138 605,150 670,100 735,68 800,44"
            fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="430" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="430;0;0;430" keyTimes="0;0.5;0.9;1" dur="4.8s" repeatCount="indefinite"/>
  </polyline>

  <circle cx="800" cy="44" r="5" fill="#22c55e">
    <animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
